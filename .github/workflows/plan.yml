name: plan

on:
  pull_request:
    paths:
      - 'infra/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
  TF_IN_AUTOMATION: 'true'

jobs:
  plan:
    # A pull request from a fork gets no OIDC token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: terraform plan
        id: plan
        working-directory: infra/env
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"
          set +e
          terraform plan -no-color -input=false -lock-timeout=5m -detailed-exitcode > "$RUNNER_TEMP/plan.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/plan.txt"
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      - name: Post the plan
        if: steps.plan.outputs.exitcode != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- terraform-plan -->'
          case "$EXIT_CODE" in
            0) result='No changes.' ;;
            2) result="$(grep -m 1 '^Plan:' "$RUNNER_TEMP/plan.txt" || echo 'Changes.')" ;;
            *) result='The plan failed.' ;;
          esac
          body="$RUNNER_TEMP/comment.md"
          {
            echo "$marker"
            echo "### terraform plan"
            echo
            echo "$result Commit $SHA, [run log]($RUN_URL)."
            if [ "$(wc -c < "$RUNNER_TEMP/plan.txt")" -gt 60000 ]; then
              echo "The plan below is cut at 60,000 characters; the run log has all of it."
            fi
            echo
            echo '<details><summary>Plan</summary>'
            echo
            echo '```'
            head -c 60000 "$RUNNER_TEMP/plan.txt"
            echo
            echo '```'
            echo
            echo '</details>'
          } > "$body"
          comment="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F "body=@$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$body" > /dev/null
          fi

      - name: Fail when the plan failed
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
