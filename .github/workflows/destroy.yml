name: destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type destroy to delete the environment. The bootstrap stays.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
  TF_IN_AUTOMATION: 'true'

jobs:
  destroy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check the input and the branch
        if: inputs.confirm != 'destroy' || github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main and type destroy."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: terraform init
        working-directory: infra/env
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      - name: Scale the service to 0
        working-directory: infra/env
        run: |
          if ! cluster="$(terraform output -raw cluster 2> /dev/null)"; then
            echo "No service in the state."
            exit 0
          fi
          service="$(terraform output -raw app_service)"
          aws ecs update-service --cluster "$cluster" --service "$service" --desired-count 0 \
            --query 'service.desiredCount' --output text
          aws ecs wait services-stable --cluster "$cluster" --services "$service"

      - name: terraform destroy
        working-directory: infra/env
        run: terraform destroy -auto-approve -input=false
