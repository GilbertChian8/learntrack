services:
    app:
        build: .
        image: learntrack:local
        ports:
            - '8080:8080'
        env_file: .env
        environment:
            DB_HOST: mysql
        # Local-only startup steps, then the image's own entrypoint.
        entrypoint: ['sh', '/usr/local/bin/local-entrypoint.sh']
        command: ['/init']
        volumes:
            - ./docker/local-entrypoint.sh:/usr/local/bin/local-entrypoint.sh:ro
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: learntrack
        ports:
            - '3306:3306'
        volumes:
            - mysql:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

volumes:
    mysql:
